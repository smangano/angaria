name: Cachegrind profiling (on demand)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle-profile:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'profile-cachegrind' || github.event.label.name == 'profile-cachegrind-compare'
    name: Linux x86_64 cycle profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check native architecture
        run: |
          uname -sm
          test "$(uname -m)" = "x86_64"
      - name: Install profiling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ cmake libboost-dev python3 valgrind
          valgrind --version
      - name: Configure optimized profiling executable
        run: >-
          cmake -S . -B build/cachegrind
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS=-g
          -DBUILD_TESTING=OFF
          -DANGARIA_BUILD_BENCHMARKS=ON
          -DANGARIA_ENABLE_DIAGNOSTICS=OFF
          -DANGARIA_ENABLE_CACHEGRIND=ON
      - name: Build profiling executable
        run: cmake --build build/cachegrind --target angaria_transport_diagnostics --parallel 3
      - name: Check out comparison base
        if: github.event_name == 'pull_request' && github.event.label.name == 'profile-cachegrind-compare'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: build/profile-before
          persist-credentials: false
      - name: Build comparison base
        if: github.event_name == 'pull_request' && github.event.label.name == 'profile-cachegrind-compare'
        working-directory: build/profile-before
        run: |
          cmake -S . -B build/cachegrind -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-g -DBUILD_TESTING=OFF -DANGARIA_BUILD_BENCHMARKS=ON -DANGARIA_ENABLE_DIAGNOSTICS=OFF -DANGARIA_ENABLE_CACHEGRIND=ON
          cmake --build build/cachegrind --target angaria_transport_diagnostics --parallel 3
      - name: Profile comparison base
        if: github.event_name == 'pull_request' && github.event.label.name == 'profile-cachegrind-compare'
        id: profile_before
        working-directory: build/profile-before
        run: >-
          python3 -B benchmarks/run_cachegrind.py
          build/cachegrind/angaria_transport_diagnostics
          --output "$GITHUB_WORKSPACE/build/cachegrind-results/before"
          --repetitions 3
          --host-label "GitHub hosted Ubuntu 24.04 x86_64; fixed simulated cache model; comparison base"
      - name: Profile nine serial cycle cases
        id: profile
        env:
          ANGARIA_PROFILE_OUTPUT: ${{ github.event.label.name == 'profile-cachegrind-compare' && 'build/cachegrind-results/after' || 'build/cachegrind-results' }}
        run: >-
          python3 -B benchmarks/run_cachegrind.py
          build/cachegrind/angaria_transport_diagnostics
          --output "$ANGARIA_PROFILE_OUTPUT"
          --repetitions 3
          --host-label "GitHub hosted Ubuntu 24.04 x86_64; fixed simulated cache model"
      - name: Retain raw profiles and matrix
        if: always() && (steps.profile.outcome != 'skipped' || steps.profile_before.outcome != 'skipped')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cachegrind-linux-x86_64-cycle
          path: build/cachegrind-results/
          if-no-files-found: error
          retention-days: 14
