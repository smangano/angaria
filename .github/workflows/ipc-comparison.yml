name: IPC comparison (on demand)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      blocks:
        description: ABBA blocks per payload/history cell
        type: choice
        options: ['5', '1']
        default: '5'

permissions:
  contents: read

jobs:
  comparison:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'compare-nanomsg'
    name: Linux x86_64 bounded IPC comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check native architecture
        run: test "$(uname -m)" = x86_64
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libboost-dev python3
      - name: Configure ordinary comparison
        run: >-
          cmake -S . -B build/ipc -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS=-g -DCMAKE_C_FLAGS=-g
          -DBUILD_TESTING=OFF -DANGARIA_BUILD_IPC_COMPARISON=ON
          -DANGARIA_ENABLE_DIAGNOSTICS=OFF -DANGARIA_ENABLE_CACHEGRIND=OFF
      - name: Build both comparison profiles
        run: cmake --build build/ipc --target angaria_ipc_comparison --parallel 3
      - name: Qualify the runner and adapters
        run: python3 -B test/ipc_comparison.py build/ipc/angaria_ipc_comparison
      - name: Record matched bounded cohorts
        id: measurements
        env:
          ANGARIA_COMPARISON_BLOCKS: ${{ inputs.blocks || '5' }}
        run: >-
          python3 -B benchmarks/run_ipc_comparison.py build/ipc/angaria_ipc_comparison
          --output build/ipc-results --blocks "$ANGARIA_COMPARISON_BLOCKS"
          --host-label "GitHub hosted Ubuntu 24.04 x86_64; ordinary IPC comparison"
      - name: Retain all comparison attempts
        if: always() && steps.measurements.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ipc-comparison-linux-x86_64
          path: build/ipc-results/
          if-no-files-found: error
          retention-days: 14

  native-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'compare-nanomsg'
    name: ${{ matrix.profile }} comparison correctness
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: Linux ARM64
            runner: ubuntu-24.04-arm
            architecture: aarch64
          - profile: macOS ARM64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check native architecture
        env:
          ANGARIA_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$ANGARIA_EXPECTED_ARCH"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libboost-dev python3
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install boost
      - name: Configure and build ordinary comparison
        shell: bash
        run: |
          cmake -S . -B build/ipc -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-g -DCMAKE_C_FLAGS=-g -DBUILD_TESTING=OFF -DANGARIA_BUILD_IPC_COMPARISON=ON -DANGARIA_ENABLE_DIAGNOSTICS=OFF -DANGARIA_ENABLE_CACHEGRIND=OFF
          cmake --build build/ipc --target angaria_ipc_comparison --parallel 3
      - name: Qualify both profiles without performance thresholds
        run: python3 -B test/ipc_comparison.py build/ipc/angaria_ipc_comparison
