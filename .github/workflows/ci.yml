name: Linux CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-dev libgtest-dev python3 strace
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DANGARIA_ENABLE_DIAGNOSTICS=ON
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test including endpoint restart walkthrough
        run: ctest --test-dir build --output-on-failure
      - name: Retain tests and focused codec performance
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codec-tests-linux-x86_64
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
      - name: Retain public runtime performance checks
        run: ctest --test-dir build --output-on-failure -V -R '^public_runtime_performance$'
