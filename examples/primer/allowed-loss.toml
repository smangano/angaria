# Copy beside a fresh Session path before running lesson 16.
config_version = 1

[session]
name = "Allowed-loss ticks"
directory = "allowed-loss-session"
max_log_bytes = 1048576

[limits]
tasks = 2
queues = 1
source_sets = 1
publishing_sets = 0
memberships_per_set = 1
fields = 1
message_schemas = 1
symbols = 0
string_pool_bytes = 0

[defaults.queue]
ring_capacity = 2
delivery = "recover_from_log"

[[tasks]]
name = "Feed"

[[tasks]]
name = "Consumer"

[[source_sets]]
name = "ConsumerInputs"
owner = "Consumer"

[[queues]]
name = "Ticks"
producer = "Feed"
source_set = "ConsumerInputs"
delivery = "allow_loss"

[[fields]]
name = "PriceTicks"
id = 0xEE000001
type = "int64"

[[messages]]
name = "Tick"
type = 1
version = 1
fields = ["PriceTicks"]
