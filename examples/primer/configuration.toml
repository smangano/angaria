# Copy this file to a fresh temporary directory before running lesson 7.
# The Session directory is relative to this file, not the shell's directory.
config_version = 1

[session]
name = "Primer configuration"
application_version = "Primer-1"
directory = "primer-session"
max_log_bytes = 1048576

[limits]
tasks = 8
queues = 8
source_sets = 4
publishing_sets = 4
memberships_per_set = 4
fields = 16
message_schemas = 8
symbols = 0
string_pool_bytes = 0

[defaults.queue]
ring_capacity = 8

[[tasks]]
name = "Setup"

[[tasks]]
name = "Feed"

[[tasks]]
name = "Consumer"

[[source_sets]]
name = "ConsumerInputs"
owner = "Consumer"

[[queues]]
name = "FeedToConsumer"
producer = "Feed"
source_set = "ConsumerInputs"

[[publishing_sets]]
name = "FeedUpdates"
owner = "Feed"
destinations = ["FeedToConsumer"]

[[fields]]
name = "PriceTicks"
id = 0xEE000001
type = "int64"
doc = "Price expressed in minimum price increments"

[[fields]]
name = "Quantity"
id = 0xEE000002
type = "uint64"

[[messages]]
name = "Quote"
type = 1
version = 1
fields = ["PriceTicks", "Quantity"]
